services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: candy_forecast
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candy_forecast"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/candy_forecast
      # Hot-reload api when sources change (host → container bind mount below).
      UVICORN_RELOAD: "1"
    volumes:
      - ./src/backend:/app/src/backend
      - ./alembic.ini:/app/alembic.ini
      # Загруженные бланки заказа (ORDER_BLANK_STORAGE_DIR по умолчанию: data/order_blanks)
      - ./data/order_blanks:/app/data/order_blanks
      - ./data/clean:/app/data/clean
      - ./src/analytics/models:/app/src/analytics/models
      # Папка для логов бэкенда
      - ./logs:/app/logs
    env_file:
      - path: src/backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DISABLE_AUTH: "true"
      VITE_PROXY_TARGET: "http://api:8000"
    depends_on:
      - api

volumes:
  pgdata:
