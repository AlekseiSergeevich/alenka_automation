# Production-oriented Compose overlay: no hot-reload, no source bind mount.
# Usage from repo root:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
services:
  api:
    environment:
      UVICORN_RELOAD: "0"
      APP_DEBUG: "false"
      ENABLE_SABY_DEBUG_API: "false"
    volumes: []
